name: Build and Release BetterRagnarok

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build BetterRagnarok.phar & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          ini-values: phar.readonly=0

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --ignore-platform-reqs
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Update Version Info (Mark Stable Build)
        run: |
          php <<'PHP'
<?php
$path = "src/VersionInfo.php";
if (!file_exists($path)) {
    echo "src/VersionInfo.php not found, skipping version bump...\n";
    exit(0);
}
$contents = file_get_contents($path);
$patterns = [
    "/IS_DEVELOPMENT_BUILD\s*=\s*true\s*;/i",
    "/BUILD_CHANNEL\s*=\s*[\"\'][^\"\']+[\"\']\s*;/i"
];
$replacements = [
    "IS_DEVELOPMENT_BUILD = false;",
    "BUILD_CHANNEL = \"stable\";"
];
$updated = preg_replace($patterns, $replacements, $contents, -1, $count);
if ($count > 0) {
    file_put_contents($path, $updated);
    echo "Successfully updated VersionInfo.php ($count replacements).\n";
} else {
    echo "Notice: No development build strings found to replace.\n";
}
PHP

      - name: Build BetterRagnarok.phar
        run: |
          if [ -f "build/build.php" ]; then
            php -d phar.readonly=0 build/build.php
          else
            php -d phar.readonly=0 <<'PHP'
<?php
$phar = new Phar("BetterRagnarok.phar");
$phar->buildFromDirectory(__DIR__);
$phar->setStub($phar->createDefaultStub("src/pocketmine/PocketMine.php"));
PHP
          fi

      - name: Verify PHAR Build
        run: |
          if [ ! -f "BetterRagnarok.phar" ]; then
            echo "Error: BetterRagnarok.phar was not generated!"
            exit 1
          fi
          echo "BetterRagnarok.phar successfully created."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterRagnarok.phar
          path: BetterRagnarok.phar
          retention-days: 7

      - name: Create GitHub Release and Upload PHAR
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: BetterRagnarok.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
